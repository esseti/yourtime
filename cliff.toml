[changelog]
header = "# Changelog\n\n"
body = """
{% if version %}\
## {{ version }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | trim }}
{% for commit in commits %}
- {{ commit.message | upper_first }}
{% endfor %}

{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
tag_pattern = "v[0-9].*"

# Order matters: first match wins
[[git.commit_parsers]]
message = "(?i)\\b(workflow|github.action|\\bci\\b|\\bbuild\\b|base.image|release)\\b"
group = "CI / Build"

[[git.commit_parsers]]
message = "(?i)\\b(mac.?app|xcode|xcodeproj|swift|menu.bar|yourtime\\.app|mac.agent|accessibility)\\b"
group = "Mac App"

[[git.commit_parsers]]
message = "(?i)\\b(docker|dashboard|pnpm|next(\\.js)?|node|npm|web|container)\\b"
group = "Web Dashboard"

[[git.commit_parsers]]
message = ".*"
group = "General"
